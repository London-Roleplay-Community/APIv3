name: Build and deploy Node.js app to Azure Web App - jaxonapiv3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build
      
      - name: Prod install
        run: |
          rm -rf node_modules
          pnpm install --frozen_lockfile --prod

      - name: Test modules
        run: | 
          test -d node_modules/body-parser
          node -e "require('express')"
          test -f dist/server.js


      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            dist/
            node_modules/
            package.json
            .npmrc

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'jaxonapiv3'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D63B9F62AC1747B5BC3556923086CB06 }}
          package: .
