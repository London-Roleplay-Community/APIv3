name: Build and deploy Node.js app to Azure Web App - jaxonapiv3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: pnpm

      # 1. Clean install everything using our hoisted linker rules
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 2. Run the compiler script ("build": "tsc") to build your dist/ folder
      - name: Build application
        run: pnpm run build

      # 3. Prune development packages so you aren't deploying unnecessary tools
      - name: Prune dev dependencies
        run: pnpm prune --prod --no-optional

      # 4. Zip your built dist/ files and production node_modules cleanly
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            dist/
            node_modules/
            package.json
            .npmrc

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'jaxonapiv3'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
